name: economics
description: >
  The economic performance index. The README's third observation was that
  "efficiently" is not a well-posed objective for this plant, and it is right:
  maximising methane, maximising energy efficiency and maximising utilisation are
  three different policies. This file pins down one number instead -- the
  levelised cost of methane, EUR per kg CH4 -- and every controller is judged on
  it. It doubles as the siting tool's headline output.

  Costs are 2024 European utility-scale estimates. They are assumptions, not
  quotes, and the LCOM is therefore a comparative instrument: use it to rank
  strategies and sites, not as a bankable cost.

params:
  discount_rate:
    value: 0.07
    units: 1/yr
    provenance: assumed
    note: "Real WACC for a merchant renewable-fuels project."

  project_lifetime_years:
    value: 25.0
    units: yr
    provenance: assumed
    note: "Matches typical PV warranty life; the battery is replaced within it."

  pv_capex_per_kwp:
    value: 700.0
    units: EUR/kW_p
    provenance: assumed
    note: "Installed utility-scale PV including mounting, inverter and civils."
    uncertain: true
    sigma: 0.20

  process_capex_per_kw:
    value: 2200.0
    units: EUR/kW
    provenance: assumed
    note: >
      Installed cost of the whole power-to-methane chain per kW of electrical
      rating: electrolyser stack and BoP, air contactor, calciner, Sabatier
      reactor. Dominated by the electrolyser at present-day prices.
    uncertain: true
    sigma: 0.30

  fixed_opex_fraction:
    value: 0.03
    units: 1/yr
    provenance: assumed
    note: "Annual fixed O&M as a fraction of total capex. Higher than a PV plant alone because of the chemistry."

  water_cost_per_m3:
    value: 2.50
    units: EUR/m^3
    provenance: assumed
    note: >
      Delivered demineralised water at a remote semi-arid site. Matters more
      than it looks: the plant needs about 2.25 kg of water per kg of methane
      after condensate recycle.

  methane_price_per_kg:
    value: 5.50
    units: EUR/kg
    provenance: assumed
    note: >
      The value the *controller* places on a kilogram of methane. This is not a
      market price and is deliberately above one: a green-gas price with
      certificates is around EUR 1.80/kg (EUR 130/MWh on an LHV basis), and that
      is what a plant would actually sell for.

      The controller is judged on LCOM, which at the reference sizing is about
      EUR 6/kg and is almost entirely sunk capital. Writing LCOM as L = C/Q with
      C = F + vQ, a control change adding dQ at extra cost dC moves it by
      dL = (dC - L dQ)/Q -- so it is worth spending up to L euros for another
      kilogram. Priced at 1.80 the controller trades every marginal cost against
      a number roughly a third of the one it is scored on, and it is
      systematically biased against producing.

      The binding comparison is against battery wear. A round trip costs
      `cost_per_kWh_delivered` = capex / (capacity * DoD_ref * cycle_life * RTE)
      = EUR 0.0565/kWh at the reference pack, against a night-time shadow price
      of about EUR 0.043/kWh. Below the crossover the optimiser declines to
      cycle: it curtails a third of the array, runs the battery flat overnight
      and trips the bus.

      **Raised from 3.00 to 5.50 on 17 September 2026.** The 3.00 figure was
      chosen when the battery wear cost was EUR 0.042/kWh -- just under the
      shadow price. Correcting the battery economics (DoD-dependent cycle life,
      and the round-trip efficiency in the denominator) raised the wear cost by
      35 % to 0.0565, which put 3.00 on the wrong side of the crossover and
      reproduced the exact failure mode previously documented at 1.80. Measured
      on `dispatch`, 3 days at Seville under the corrected economics:

        price     methane     night   curtail   trips   LCOM
        3.00    126.9/day     30.9%     25.7%     243   6.53
        4.50    138.2/day     33.6%     19.9%     180   6.15

      5.50 sits above the corrected crossover with margin, rather than at the
      edge of it -- which is what 3.00 turned out to be, and is why a change
      elsewhere in the model was able to invalidate it silently. The parameter
      is a control tuning knob, not a forecast, so margin is worth more than
      precision here.

      Caveat: `revenue_EUR`, `marginal_objective_EUR` and `payback_years` all
      read this parameter, so they report against a control price rather than a
      market price and overstate commercial return. LCOM does not -- it is
      capital over production and is independent of price -- so every controller
      comparison remains like-for-like.
    uncertain: true
    sigma: 0.25

  startup_cost_EUR:
    value: 40.0
    units: EUR
    provenance: assumed
    note: >
      Wear-and-tear charge per process start, over and above the start-up
      energy. Represents thermal-cycling damage to the kiln refractory and the
      Sabatier catalyst. This is what stops the controller chasing every cloud.

  curtailment_penalty_per_kwh:
    value: 0.0
    units: EUR/kWh
    provenance: assumed
    note: >
      Deliberately zero. Off-grid there is no counterfactual buyer for curtailed
      solar, so curtailment has no direct cost -- it is a *symptom*, reported
      because the brief asks for it, not a term to be optimised away. Charging
      for it would bias the controller into cycling the battery pointlessly.

  co2_credit_per_kg:
    value: 0.0
    units: EUR/kg
    provenance: assumed
    note: >
      Value of the CO2 removed from air, set to zero in the base case. A carbon
      price is a sensitivity in the siting study, not a base-case assumption.
